      { id: 'open_ominous_vault', tab: 'adventure', title: 'Revaulting', description: 'Open an Ominous Vault using an Ominous Trial Key.', requirement: 'Usar un Ominous Trial Key en un Ominous Vault.', type: 'goal' },
      { id: 'kill_breeze_with_wind_charge', tab: 'adventure', title: 'Blowback', description: 'Kill a Breeze using a deflected Wind Charge.', requirement: 'Matar un Breeze con un Wind Charge rebotado por el propio Breeze.', type: 'challenge' },
      { id: 'mace_overkill', tab: 'adventure', title: 'Over-Overkill', description: 'Deal 50 hearts of damage in a single hit using a Mace.', requirement: 'Infligir el daño equivalente a 50 corazones de una sola vez con un Mace (smash attack).', type: 'challenge' },

      // HUSBANDRY (31)
      { id: 'husbandry_root', tab: 'husbandry', title: 'Husbandry', description: 'The world is full of friends and food.', requirement: 'Comer cualquier alimento.', type: 'task' },
      { id: 'stay_hydrated', tab: 'husbandry', title: 'Stay Hydrated!', description: 'Place a Dried Ghast in water.', requirement: 'Colocar un Dried Ghast en agua.', type: 'task' },
      { id: 'bee_nest_campfire', tab: 'husbandry', title: 'Bee Our Guest', description: 'Use a Campfire to collect Honey from a Beehive using a Bottle without aggravating the bees.', requirement: 'Colocar una Campfire bajo una Beehive o Bee Nest llena y recoger miel con una Glass Bottle.', type: 'task' },
      { id: 'breed_an_animal', tab: 'husbandry', title: 'The Parrots and the Bats', description: 'Breed two animals together.', requirement: 'Reproducir cualquiera de los 27 animales de la lista.', type: 'task' },
      { id: 'allay_deliver_item', tab: 'husbandry', title: "You've Got a Friend in Me", description: 'Have an Allay deliver items to you.', requirement: 'Dar un ítem a un Allay y que te lo devuelva con más ítems.', type: 'task', hidden: true },
      { id: 'ride_boat_with_goat', tab: 'husbandry', title: 'Whatever Floats Your Goat!', description: 'Get in a boat with a Goat.', requirement: 'Montarse en un bote junto a un Goat.', type: 'task' },
      { id: 'tame_an_animal', tab: 'husbandry', title: 'Best Friends Forever', description: 'Tame an animal.', requirement: 'Domar cualquiera de los 11 animales de la lista.', type: 'task' },
      { id: 'glow_ink_sac_sign', tab: 'husbandry', title: 'Glow and Behold!', description: 'Make the text of a sign glow.', requirement: 'Usar un Glow Ink Sac en un Sign o Hanging Sign.', type: 'task' },
      { id: 'catch_fish', tab: 'husbandry', title: 'Fishy Business', description: 'Catch a fish.', requirement: 'Tener en el inventario Cod, Salmon, Tropical Fish o Pufferfish (no necesariamente pescado con caña).', type: 'task' },
      { id: 'move_bee_nest_silk_touch', tab: 'husbandry', title: 'Total Beelocation', description: 'Move a Bee Nest, with 3 bees inside, using Silk Touch.', requirement: 'Romper un Bee Nest o Beehive con 3 abejas dentro usando Silk Touch.', type: 'task' },
      { id: 'tadpole_in_bucket', tab: 'husbandry', title: 'Bukkit Bukkit', description: 'Catch a Tadpole in a Bucket.', requirement: 'Usar un Water Bucket en un Tadpole.', type: 'task' },
      { id: 'sulfur_cube_absorb_tnt', tab: 'husbandry', title: 'Uh Oh', description: 'Passive Sulfur Cube absorbs a block of TNT.', requirement: 'Que un Sulfur Cube pasivo absorba un bloque de TNT.', type: 'task' },
      { id: 'obtain_sniffer_egg', tab: 'husbandry', title: 'Smells Interesting', description: 'Obtain a Sniffer Egg.', requirement: 'Tener un Sniffer Egg en el inventario.', type: 'task', hidden: true },
      { id: 'plant_seed', tab: 'husbandry', title: 'A Seedy Place', description: 'Plant a seed and watch it grow.', requirement: 'Plantar cualquiera de las semillas de la lista (incluyendo Torchflower Seeds y Pitcher Pod).', type: 'task' },
      { id: 'wax_on_copper', tab: 'husbandry', title: 'Wax On', description: 'Apply Honeycomb to a Copper block.', requirement: 'Usar Honeycomb en cualquiera de los 15 bloques de cobre enceables.', type: 'task' },
      { id: 'breed_all_animals', tab: 'husbandry', title: 'Two by Two', description: 'Breed all the animals.', requirement: 'Reproducir una pareja de cada uno de los 26 animales de la lista.', type: 'challenge' },
      { id: 'allay_drop_cake_note_block', tab: 'husbandry', title: 'Birthday Song', description: 'Have an Allay drop a Cake at a Note Block.', requirement: 'Que un Allay que recibió un pastel del jugador deje caer otro pastel en un Note Block.', type: 'task', hidden: true },
      { id: 'tame_all_cats', tab: 'husbandry', title: 'A Complete Catalogue', description: 'Tame all cat variants.', requirement: 'Domar las 11 variantes de Cat.', type: 'challenge' },
      { id: 'catch_fish_bucket', tab: 'husbandry', title: 'Tactical Fishing', description: 'Catch a fish, without a fishing rod.', requirement: 'Usar un Water Bucket en un pez vivo para capturarlo.', type: 'task' },
      { id: 'lead_all_frogs', tab: 'husbandry', title: 'When the Squad Hops into Town', description: 'Get a lead on all Frogs.', requirement: 'Poner una Lead a 4 Frogs (no necesitan estar atadas a la vez).', type: 'task' },
      { id: 'feed_snifflet', tab: 'husbandry', title: 'Little Sniffs', description: 'Feed a Snifflet.', requirement: 'Dar comida a un Snifflet.', type: 'task', hidden: true },
      { id: 'balanced_diet', tab: 'husbandry', title: 'A Balanced Diet', description: "Eat everything that is edible, even if it's not good for you.", requirement: 'Comer cada uno de los 40 alimentos de la lista.', type: 'challenge' },
      { id: 'netherite_hoe_till_earth', tab: 'husbandry', title: 'Serious Dedication', description: 'Use a Netherite hoe to till the earth.', requirement: 'Tener un Netherite Hoe en el inventario.', type: 'challenge' },
      { id: 'wax_off_copper', tab: 'husbandry', title: 'Wax Off', description: 'Scrape wax off a Copper block.', requirement: 'Usar un Axe en cualquiera de los 15 bloques de cobre enceados para retirar la cera.', type: 'task' },
      { id: 'catch_axolotl_bucket', tab: 'husbandry', title: 'The Cutest Predator', description: 'Catch an Axolotl in a Bucket.', requirement: 'Usar un Water Bucket en un Axolotl.', type: 'task' },
      { id: 'froglights_all', tab: 'husbandry', title: 'With Our Powers Combined!', description: 'Have a full set of Froglights in your inventory.', requirement: 'Tener los 3 tipos de Froglight (ochre, pearlescent, verdant) en el inventario a la vez.', type: 'goal' },
      { id: 'plant_sniffer_seed', tab: 'husbandry', title: 'Planting the Past', description: 'Plant any Sniffer seed.', requirement: 'Plantar Torchflower Seeds o Pitcher Pod.', type: 'task', hidden: true },
      { id: 'axolotl_healing_friendship', tab: 'husbandry', title: 'The Healing Power of Friendship!', description: 'Emerge from battle with your Axolotl.', requirement: 'Matar un mob mientras el jugador tiene el efecto Regeneration otorgado por un Axolotl.', type: 'task' },
      { id: 'repair_wolf_armor', tab: 'husbandry', title: 'Good as New', description: 'Repair a damaged Wolf Armor to full durability.', requirement: 'Reparar Wolf Armor hasta durabilidad completa usando Armadillo Scutes.', type: 'task' },
      { id: 'tame_all_wolf_variants', tab: 'husbandry', title: 'The Whole Pack', description: 'Tame one of each variant of Wolf.', requirement: 'Domar las 9 variantes de Wolf.', type: 'challenge' },
      { id: 'shear_wolf_armor', tab: 'husbandry', title: 'Shear Brilliance', description: 'Remove Wolf Armor from a Wolf using Shears.', requirement: 'Usar Shears en un lobo con Wolf Armor para quitársela.', type: 'task' }
    ];

    const STORAGE_KEY = 'mc_26_2_advancements_standalone_v1';
    let state = {
      completed: JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'),
      currentTab: 'all',
      search: '',
      status: 'all',
      type: 'all'
    };

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.completed));
      render();
    }

    function toggleAdvancement(id) {
      state.completed[id] = !state.completed[id];
      save();
    }

    function render() {
      const grid = document.getElementById('advancements-grid');
      const search = state.search.toLowerCase().trim();

      let completedCount = 0;
      ADVANCEMENTS.forEach(a => { if (state.completed[a.id]) completedCount++; });
      const totalCount = ADVANCEMENTS.length;
      const pct = Math.round((completedCount / totalCount) * 100);

      document.getElementById('global-stats-text').textContent = completedCount + ' / ' + totalCount + ' (' + pct + '%)';
      document.getElementById('global-progress-bar').style.width = pct + '%';

      const filtered = ADVANCEMENTS.filter(a => {
        if (state.currentTab !== 'all' && a.tab !== state.currentTab) return false;
        if (state.status === 'completed' && !state.completed[a.id]) return false;
        if (state.status === 'pending' && state.completed[a.id]) return false;
        if (state.type === 'hidden') {
          if (!a.hidden) return false;
        } else if (state.type !== 'all' && a.type !== state.type) {
          return false;
        }
        if (search) {
          const matchTitle = a.title.toLowerCase().includes(search);
          const matchDesc = a.description.toLowerCase().includes(search);
          const matchReq = a.requirement.toLowerCase().includes(search);
          if (!matchTitle && !matchDesc && !matchReq) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full bg-[#151822] border-2 border-stone-800 rounded-2xl text-center py-16 text-stone-500 font-bold">No se encontraron logros que coincidan con los filtros.</div>';
        return;
      }

      grid.innerHTML = filtered.map(a => {
        const isDone = !!state.completed[a.id];
        const isChallenge = a.type === 'challenge';
        const isGoal = a.type === 'goal';

        let borderClass = 'border-stone-800 bg-[#151822]';
        let badgeColor = 'bg-stone-800 text-stone-400 border-stone-700';

        if (isDone) {
          if (isChallenge) {
            borderClass = 'border-purple-500/80 bg-purple-950/30 ring-1 ring-purple-500/40 shadow-lg shadow-purple-900/20';
            badgeColor = 'bg-purple-900 text-purple-200 border-purple-600';
          } else if (isGoal) {
            borderClass = 'border-amber-500/80 bg-amber-950/30 ring-1 ring-amber-500/40 shadow-lg shadow-amber-900/20';
            badgeColor = 'bg-amber-900 text-amber-200 border-amber-600';
          } else {
            borderClass = 'border-emerald-500/80 bg-emerald-950/30 ring-1 ring-emerald-500/40 shadow-lg shadow-emerald-900/20';
            badgeColor = 'bg-emerald-900 text-emerald-200 border-emerald-600';
          }
        }

        return `
          <div class="border-2 rounded-xl p-4 transition-all duration-200 ${borderClass} flex flex-col justify-between select-none">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2.5">
                <div>
                  <h3 class="font-bold text-base ${isDone ? 'text-white' : 'text-stone-200'}">${a.title}</h3>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded border ${badgeColor}">${a.type === 'challenge' ? 'Desafío' : a.type === 'goal' ? 'Meta' : 'Progreso'}</span>
                    <span class="text-xs text-stone-400 capitalize">${a.tab}</span>
                  </div>
                </div>
                <button 
                  onclick="toggleAdvancement('${a.id}')"
                  class="px-3 py-1.5 rounded-lg border text-xs font-bold transition-all ${isDone ? 'bg-emerald-600 text-white border-emerald-400 shadow-md' : 'bg-stone-900 text-stone-400 border-stone-700 hover:border-stone-500 hover:text-stone-200'}"
                >
                  ${isDone ? '✓ Completado' : '○ Marcar'}
                </button>
              </div>
              <p class="text-xs text-stone-300 mb-2 leading-relaxed">${a.description}</p>
              <div class="bg-black/40 p-2.5 rounded-lg text-xs text-stone-400 border border-stone-800/80">
                <span class="text-stone-500 font-bold uppercase tracking-wider text-[10px] block mb-0.5">Requisito:</span>
                <span class="text-stone-300">${a.requirement}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.className = 'tab-btn px-4 py-2.5 rounded-xl text-sm font-bold bg-[#151822] hover:bg-stone-800 text-stone-400 border-2 border-stone-800 transition-all';
        });
        btn.className = 'tab-btn active px-4 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 border-2 border-emerald-400 text-white shadow-lg transition-all';
        state.currentTab = btn.getAttribute('data-tab');
        render();
      });
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      state.search = e.target.value;
      render();
    });

    document.getElementById('status-filter').addEventListener('change', (e) => {
      state.status = e.target.value;
      render();
    });

    document.getElementById('type-filter').addEventListener('change', (e) => {
      state.type = e.target.value;
      render();
    });

    document.getElementById('reset-all-btn').addEventListener('click', () => {
      if (confirm('¿Deseas reiniciar todo tu progreso de logros?')) {
        state.completed = {};
        save();
      }
    });

    render();
  </script>
</body>
</html>
